<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="octBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#040814"/>
      <stop offset="100%" stop-color="#0E1428"/>
    </linearGradient>
    <radialGradient id="corneaGrad" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#9DD9F2" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#3F94CC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#16344F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="irisGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8B97A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5A3F1F" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="lensGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#A4D7EE" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#1B3D5C" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="speckle" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.4   0 0 0 0 0.55  0 0 0 0 0.65  0 0 0 0.18 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="softBlur"><feGaussianBlur stdDeviation="1"/></filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="480" fill="url(#octBg)"/>

  <!-- Faint grid (clinical OCT shows depth grid) -->
  <g stroke="#1A2540" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="120" x2="720" y2="120"/>
    <line x1="0" y1="240" x2="720" y2="240"/>
    <line x1="0" y1="360" x2="720" y2="360"/>
    <line x1="180" y1="0" x2="180" y2="480"/>
    <line x1="360" y1="0" x2="360" y2="480"/>
    <line x1="540" y1="0" x2="540" y2="480"/>
  </g>

  <!-- CORNEA — outer epithelium curve -->
  <path d="M 60,180 Q 360,40 660,180 L 660,210 Q 360,75 60,210 Z" fill="url(#corneaGrad)"/>
  <path d="M 60,180 Q 360,40 660,180" fill="none" stroke="#C3EAF8" stroke-width="2" opacity="0.88"/>
  <path d="M 60,210 Q 360,75 660,210" fill="none" stroke="#7CBADD" stroke-width="1.2" opacity="0.7"/>

  <!-- IRIS — left + right wedges -->
  <path d="M 60,210 Q 200,200 250,235 L 250,255 Q 200,222 60,232 Z" fill="url(#irisGrad)" opacity="0.92"/>
  <path d="M 660,210 Q 520,200 470,235 L 470,255 Q 520,222 660,232 Z" fill="url(#irisGrad)" opacity="0.92"/>

  <!-- LENS (crystalline) — biconvex shape behind pupil -->
  <ellipse cx="360" cy="290" rx="180" ry="42" fill="url(#lensGrad)"/>
  <ellipse cx="360" cy="290" rx="180" ry="42" fill="none" stroke="#BFE1F0" stroke-width="1.4" opacity="0.85"/>

  <!-- Speckle/noise overlay over the whole scan for realistic OCT look -->
  <rect width="720" height="480" fill="#000" filter="url(#speckle)" opacity="0.45"/>

  <!-- === MEASUREMENTS overlay === -->
  <!-- ATA: angle-to-angle horizontal between two iris recesses -->
  <line x1="245" y1="245" x2="475" y2="245" stroke="#FFC857" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="245" cy="245" r="3.5" fill="#FFC857"/>
  <circle cx="475" cy="245" r="3.5" fill="#FFC857"/>
  <text x="360" y="237" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFC857">ATA · 11.45 mm</text>

  <!-- ACD: vertical from cornea endothelium to lens anterior pole -->
  <line x1="360" y1="80" x2="360" y2="260" stroke="#5BE0A0" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="360" cy="80" r="3" fill="#5BE0A0"/>
  <circle cx="360" cy="260" r="3" fill="#5BE0A0"/>
  <text x="372" y="178" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#5BE0A0">ACD · 3.11 mm</text>

  <!-- aRISE: small line from ATA midpoint to anterior lens (visualizes lens vault) -->
  <line x1="360" y1="245" x2="360" y2="262" stroke="#FF8AB5" stroke-width="1.4"/>
  <text x="372" y="258" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#FF8AB5">aRISE 0.22 mm</text>

  <!-- === HUD overlays (Casia2 style) === -->
  <g font-family="Inter, monospace" fill="#9DD9F2">
    <!-- Top-left: device + scan info -->
    <rect x="14" y="14" width="190" height="60" fill="rgba(0,0,0,0.55)" rx="3"/>
    <text x="22" y="32" font-size="11" font-weight="700" fill="#fff">CASIA2 · AS-OCT</text>
    <text x="22" y="46" font-size="10" opacity="0.85">SCAN · 16-radial · 360°</text>
    <text x="22" y="60" font-size="10" opacity="0.85">2026-04-25 · OD · L. CASTRO</text>

    <!-- Top-right: patient + scan params -->
    <rect x="516" y="14" width="190" height="60" fill="rgba(0,0,0,0.55)" rx="3"/>
    <text x="700" y="32" text-anchor="end" font-size="11" font-weight="700" fill="#fff">SCAN PARAMS</text>
    <text x="700" y="46" text-anchor="end" font-size="10" opacity="0.85">Depth 6.0 mm · Width 16.0 mm</text>
    <text x="700" y="60" text-anchor="end" font-size="10" opacity="0.85">A-scans · 2,048 / B-scan</text>

    <!-- Bottom-left: scale bar -->
    <line x1="22" y1="450" x2="92" y2="450" stroke="#fff" stroke-width="1.5"/>
    <line x1="22" y1="445" x2="22" y2="455" stroke="#fff" stroke-width="1.5"/>
    <line x1="92" y1="445" x2="92" y2="455" stroke="#fff" stroke-width="1.5"/>
    <text x="57" y="442" text-anchor="middle" font-size="10" fill="#fff">2.0 mm</text>

    <!-- Bottom-right: REC indicator -->
    <circle cx="676" cy="452" r="4" fill="#FF6B6B"/>
    <text x="700" y="456" text-anchor="end" font-size="10" font-weight="700" fill="#FF6B6B">● REC</text>
  </g>
</svg>
