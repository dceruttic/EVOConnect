<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stella — STAAR Surgical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
/* ==================================================================
   STELLA replica — REVAI / ESCRS demonstration build (v3, English UI)
   Tokens measured from the live application with getComputedStyle
   (Stella version 2.00 / Calculator V8.00 OUS). Synthetic data only.
   ================================================================== */
:root{
  --teal:#10A8BA; --teal-2:#00ABBD;
  --banner:#0C7E8B; --tab-on:#08545D; --sel-head:#337A87;
  --green:#409026; --green-edge:#309A22; --green-ok:#3DBE6B;
  --invalid:#E0736A; --toast:#B4342B;
  --purple:#B57BFF;
  --page:#F0F2F4; --ink:#1C1C1C; --ink-2:#616469;
  --muted:#91979D; --muted-2:#C2C9D1;
  --row-alt:#F9FAFA; --row-sel:#E6FFFF;
  --th-bg:#F2F2F2; --th-dark:#5B6067;
  --line:#DDDDDD; --line-2:#E0E4E8; --line-3:#D9D7D5; --btn-line:#747474;
  --sh-card:rgba(0,0,0,.1) 0 2px 5px 0;
  --sh-box:rgba(0,0,0,.24) 0 2px 4px 0;
  --font:'Proxima Nova','ProximaNova-Regular','Mulish',-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;font-family:var(--font);font-size:16px;color:var(--ink);
  background:var(--page);-webkit-font-smoothing:antialiased;padding-bottom:26px}
a{color:var(--teal);text-decoration:none;cursor:pointer}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* top bar */
.topbar{background:var(--page);display:flex;align-items:center;gap:26px;padding:6.88px 22px;
  height:53px;position:sticky;top:0;z-index:40;box-shadow:rgba(0,0,0,.16) 0 4px 8px 0}
.brand{width:32px;height:32px;border-radius:50%;background:var(--teal);flex:none;display:grid;place-items:center}
.navlink{background:none;border:0;font-size:16px;color:var(--ink);padding:6px 0;white-space:nowrap}
.navlink.on{font-weight:700}
.grow{margin-left:auto}
.timer{font-size:17px;color:var(--ink-2);white-space:nowrap}
.helpdot{width:31px;height:31px;border-radius:50%;background:var(--muted);color:#fff;
  display:grid;place-items:center;font-size:18px;font-weight:700;flex:none}
.acct{border:1px solid var(--line-2);border-radius:5px;height:40px;min-width:252px;padding:0 14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;
  white-space:nowrap;background:#fff}
.acct em{font-style:normal;color:var(--muted)}
.who{width:34px;height:34px;border-radius:50%;border:2px solid var(--muted);flex:none;
  display:grid;place-items:center;color:var(--muted);background:#fff}
.usermenu{position:absolute;right:24px;top:62px;background:#fff;border:1px solid var(--line-2);
  border-radius:6px;box-shadow:var(--sh-card);padding:14px 26px;font-size:16px;z-index:50}

/* buttons */
.b{font-size:12px;font-weight:600;line-height:16px;padding:8px 16px;border-radius:8px;
  border:1px solid transparent;background:#fff;display:inline-flex;align-items:center;gap:8px}
.b-primary{background:var(--teal);border-color:var(--teal);color:#fff}
.b-outline{background:#fff;border-color:var(--btn-line);color:var(--ink-2)}
.b-dark{background:var(--ink-2);border-color:transparent;color:#fff;font-size:16px}
.b-grey{background:#B9BEC4;border-color:#B9BEC4;color:#fff}
.b-purple{background:var(--purple);border-color:var(--purple);color:#fff;font-size:14px}
.b-lg{font-size:14px;padding:10px 18px}
.b[disabled]{opacity:.45;cursor:default}

/* page chrome */
.wrap{padding:0 24px 44px;max-width:1560px;margin:0 auto}
h1.page{font-size:clamp(34px,4.4vw,63.52px);font-weight:500;line-height:1.06;
  letter-spacing:-2px;color:var(--teal);margin:34px 0 24px;min-width:0;overflow-wrap:break-word}
/* the Announcements heading is smaller in the real app (~44px) and lives in a
   356px column, so it gets its own scale and is allowed to wrap */
h1.page.ann{font-size:clamp(26px,2.9vw,44px);letter-spacing:-1px;margin:34px 0 20px}
.card{background:#fff;border-radius:8px;padding:16px;box-shadow:var(--sh-card)}
.card-h{font-size:20px;font-weight:600;line-height:28px;color:#000}
.card-s{font-size:15px;line-height:20px;color:var(--muted)}
.toolbar{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.search{display:flex;align-items:stretch}
.search .ico{width:44px;border:1px solid var(--line-2);border-right:0;border-radius:8px 0 0 8px;
  background:#fff;display:grid;place-items:center;color:var(--muted)}
.search input{height:34px;border:1px solid var(--line-2);border-radius:0 8px 8px 0;padding:8px 16px;
  font-size:12px;font-family:inherit;color:var(--ink);min-width:258px}
.txtin{height:34px;border:1px solid var(--line-2);border-radius:8px;padding:8px 16px;
  font-size:12px;font-family:inherit}

/* tables */
table{width:100%;border-collapse:collapse}
thead th{background:var(--th-bg);color:rgba(0,0,0,.5);font-size:16px;font-weight:600;text-align:left;
  padding:9px;border-bottom:1px solid var(--line);vertical-align:bottom}
thead th.sorted{color:var(--teal)}
thead th .u{display:block;font-size:12px;font-weight:400;color:var(--muted)}
thead th.sorted .u{color:var(--teal)}
thead th.grp{background:var(--th-dark);color:#fff;text-align:center;font-weight:400;padding:4px 12px}
tbody td{font-size:13.712px;line-height:18.24px;color:var(--muted);padding:8px 4px 8px 8px;
  border-bottom:1px solid var(--line);vertical-align:top;background:#fff}
tbody tr:nth-child(even) td{background:var(--row-alt)}
tbody td .k{color:var(--ink)}
td a{font-size:13.008px}
.sortic{display:inline-block;color:var(--muted);font-size:8px;line-height:8px;margin-left:6px;vertical-align:middle}
.pill-iod{border:1px solid var(--teal);color:var(--teal);border-radius:4px;padding:0 5px;
  font-size:10px;font-weight:600;letter-spacing:.5px}
.eyebadge{background:var(--th-dark);color:#fff;border-radius:3px;padding:1px 6px;font-size:11px;
  font-weight:600;letter-spacing:.5px}
.prn{color:var(--ink-2);cursor:pointer;display:inline-flex;vertical-align:-2px}
.pager{display:flex;gap:6px;justify-content:flex-end;padding:16px 4px 4px}
.pager button{width:30px;height:30px;border:1px solid var(--line-2);background:#fff;border-radius:4px;
  color:var(--teal);font-size:13px}
.pager button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.pager button[disabled]{color:#C9CDD2;cursor:default}
.grpicons{display:inline-flex;gap:5px;vertical-align:-4px}
.grpicons svg{width:17px;height:17px}

/* filter popover */
.rel{position:relative}
.pop{position:absolute;right:0;top:44px;width:330px;background:#fff;border:1px solid var(--line-2);
  border-radius:8px;box-shadow:var(--sh-card);padding:16px 20px 14px;z-index:30}
.pop h4{margin:0 0 8px;font-size:15px;font-weight:400}
.pop .g{display:grid;grid-template-columns:1fr 1fr;gap:14px 10px;margin:16px 0}
.pop .row{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink)}
.pop .acts{display:flex;gap:10px}
.tg{width:32px;height:17px;border-radius:9px;background:#C9CDD2;position:relative;border:0;flex:none;
  display:inline-block;cursor:pointer}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;
  background:#fff;transition:left .15s}
.tg.on{background:var(--green-ok)}
.tg.on::after{left:17px}

/* patient banner */
.pbanner{background:var(--banner);color:#fff;padding:14px 24px 18px;display:flex;gap:26px;
  align-items:flex-start;flex-wrap:wrap;min-height:137px}
.pbanner .lbl{font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:rgba(255,255,255,.75)}
.pbanner .pid{font-size:33.75px;font-weight:700;letter-spacing:1px;line-height:42px}
.pbanner .pname{font-size:22.5px;font-weight:400;line-height:31.5px;color:rgba(255,255,255,.7)}
.pbanner .age{font-size:14px}
.back{background:none;border:0;color:#fff;font-size:22px;line-height:1;padding:2px 6px 0 0}
.bactions{margin-left:auto;display:flex;flex-direction:column;gap:10px;min-width:236px}
.bbtn{font-size:13.712px;font-weight:600;line-height:18.24px;padding:7.5px 15px;border-radius:8px;
  border:1px solid #808080;background:#fff;color:#4A4A4A;text-align:left;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.bbtn[disabled]{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.26);
  color:rgba(255,255,255,.42);cursor:default}

/* preop */
.preop-branch{margin:8px 0 0 0;padding:8px 10px 10px;border:1px solid transparent;border-radius:8px;
  cursor:pointer;transition:background .12s,border-color .12s,box-shadow .12s;position:relative}
.preop-branch:hover,.preop-branch:focus-visible{background:#F2F8F9;border-color:var(--line-2);
  box-shadow:0 1px 3px rgba(16,42,52,.07);outline:none}
.preop-branch .pb-open{position:absolute;right:10px;top:8px;font-size:11.5px;font-weight:600;letter-spacing:.4px;
  text-transform:uppercase;color:var(--teal);opacity:0;transition:opacity .12s;white-space:nowrap}
.preop-branch:hover .pb-open,.preop-branch:focus-visible .pb-open{opacity:1}
.preop-run{cursor:pointer}
.eyerow{display:flex;gap:18px;align-items:stretch;min-width:0}
.eyeid{flex:none;width:112px}
.eyeboxes{display:flex;gap:14px;flex:1;min-width:0;align-items:stretch}
.refbox{flex:1 1 auto;min-width:0}
.calcbox{flex:0 0 190px;min-width:0}
.refhead{display:flex;align-items:flex-start;gap:10px;min-height:34px}
.refrow{display:flex;align-items:center;gap:12px;min-width:0}
.refrow>.fields{flex:1 1 auto;min-width:0}
.refhead>div{min-width:0}
.expghost{margin-left:auto;flex:none;width:96px;height:34px}
.grid2>.eyerow,.grid2>.fbox{min-width:0}
.bigeye{font-size:63.52px;font-weight:900;line-height:54.88px;letter-spacing:-2px;color:var(--ink-2)}
.bigeye.off{color:#B8BCC1}
.eyeicons{margin-top:12px;display:flex;gap:6px}
.eyeicons svg{width:22px;height:22px}
.fbox{background:#fff;border:1px solid var(--line-3);border-radius:8px;padding:16px;box-shadow:var(--sh-box)}
.slabel{font-size:12.855px;font-weight:600;line-height:17.1px;color:var(--teal);letter-spacing:.2px}
.slabel.grey{color:var(--muted-2)}
.rlabel{font-size:12.855px;font-weight:600;color:var(--teal);letter-spacing:.2px}
.rlabel u{color:var(--ink);font-weight:400;font-size:15px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:10px;margin-top:12px;min-width:0}
.fld{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;min-width:0}
.fld .pill{position:relative;display:flex;align-items:center}
.fld input{height:31px;width:100%;box-sizing:border-box;border:1px solid var(--invalid);border-radius:8px;background:#fff;
  font-family:inherit;font-size:12.8px;text-align:right;padding:8px 26px 8px 8px;color:var(--ink)}
.fld input.ok{border-color:var(--green-ok)}
.fld .u{position:absolute;right:9px;font-size:11px;color:var(--muted);pointer-events:none}
.fld .ro{height:31px;width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:flex-end;gap:3px;
  font-size:12.8px;font-weight:600;padding-right:9px}
.fld .cap{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fld .pill{width:100%}
.range{position:absolute;top:39px;left:50%;transform:translateX(-50%);background:#2B2E31;color:#fff;
  font-size:12px;padding:5px 10px;border-radius:3px;white-space:nowrap;z-index:20;
  display:flex;align-items:center;gap:8px}
.range::before{content:'';position:absolute;top:-5px;left:50%;margin-left:-5px;border:5px solid transparent;
  border-top:0;border-bottom-color:#2B2E31}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:4px;overflow:hidden;margin-top:10px}
.seg button{border:0;background:#F4F5F6;color:var(--muted);height:26px;padding:0 15px;font-size:12px;
  font-weight:700;letter-spacing:.6px}
.seg button.on{background:var(--green-ok);color:#fff;text-decoration:underline}
.tgrow{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:15px}
.radio{width:15px;height:15px;border-radius:50%;border:2px solid #6C7076;flex:none;display:inline-grid;
  place-items:center;background:#fff;vertical-align:-3px;cursor:pointer}
.radio.on::after{content:'';width:7px;height:7px;border-radius:50%;background:#3B6BE8}

/* corneal diagram + prompts */
.diagram{background:#2A292B;border-radius:8px;position:relative;overflow:hidden}
.diagram.dim{filter:grayscale(1) brightness(.5)}
.diagram .tag{position:absolute;top:16px;left:20px;font-size:34px;font-weight:900;color:#8A8D91}
.dbox{position:absolute;background:#212326;border:1px solid #55585C;padding:6px 9px;font-size:10.5px;
  color:#C9CDD2;line-height:1.3}
.dbox b{color:#fff;font-weight:600}
.editmask{position:absolute;inset:0;display:grid;place-items:center;cursor:pointer}
.editmask span{background:#fff;color:var(--ink);font-size:22px;padding:9px 20px;border-radius:3px}
.prompts{position:absolute;top:0;left:0;width:200px;max-height:145px;overflow-y:auto;background:#fff;
  border:1px solid var(--line-2);border-radius:0 0 4px 0;padding:16px 18px;z-index:15;
  box-shadow:var(--sh-card)}
.prompts .t{color:var(--teal);font-size:12.855px;font-weight:600;letter-spacing:.2px}
.prompts .x{margin-top:12px;font-size:14px;line-height:1.45;color:var(--ink)}

/* results */
.res{background:#fff;border-radius:8px;overflow:hidden;box-shadow:var(--sh-card)}
.reshead{background:var(--green);border-bottom:1px solid var(--green-edge);color:#fff;padding:7px 14px}
.reshead .l1{display:flex;align-items:center;gap:12px}
.reshead .e{font-size:34px;font-weight:900;line-height:1}
.reshead .m{font-size:21px;line-height:32px}
.reshead .r{margin-left:auto;text-align:right;font-size:15px;font-weight:700;line-height:20px}
.reshead .l2{font-size:15px;line-height:24px}
.res thead th{background:var(--row-alt);color:rgba(0,0,0,.5);font-size:15px;font-weight:600;
  padding:18px 15px 6px 24px;border-bottom:0}
.scroller{height:240px;overflow-y:scroll;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 44px,#000 calc(100% - 44px),transparent 100%);
          mask-image:linear-gradient(to bottom,transparent 0,#000 44px,#000 calc(100% - 44px),transparent 100%)}
.scroller::-webkit-scrollbar{width:7px}
.scroller::-webkit-scrollbar-thumb{background:#7B8085;border-radius:4px}
.scroller::-webkit-scrollbar-track{background:transparent}
.res tbody td{height:47px;font-size:15px;color:var(--ink);padding:0 15px 0 24px;
  border-bottom:1px solid #EFEFEF;background:#fff;vertical-align:middle}
.res tbody tr{cursor:pointer}
.res tbody tr:hover td{background:#F4FBFC}
.res tbody tr.sel td{background:var(--row-sel)}
.res tbody tr.blank{cursor:default}
.res tbody tr.blank td{border-bottom:0;background:#fff}
.resfoot{display:flex;align-items:center;gap:16px;padding:14px 16px;flex-wrap:wrap;font-size:15px}
.step{display:inline-flex;align-items:center;gap:9px;height:32px;padding:0 6px 0 12px;
  border:1px solid #C3CBD3;border-radius:4px;background:#EDEFF1;color:var(--muted);font-size:14px}
.step.live{background:#fff;color:var(--ink)}
.ar{display:flex;flex-direction:column;line-height:.65;font-size:10px}
.ar button{border:0;background:none;color:inherit;padding:0}
.trow{display:flex;align-items:center;gap:12px;padding:0 16px 16px}
.trow .tl{font-size:15px;color:var(--ink-2);width:74px;line-height:1.15}
.trow input{flex:1;height:32px;border:1px solid var(--line-2);border-radius:4px;background:var(--page);
  padding:0 12px;font-family:inherit;font-size:15px;color:var(--ink)}

/* inventory modal */
.scrim{position:fixed;inset:0;background:rgba(24,24,24,.5);z-index:60;display:grid;place-items:center;padding:24px}
.modal{width:min(1047px,100%);max-height:90vh;background:#F8F9FA;border-radius:16px 16px 4px 4px;
  display:flex;flex-direction:column;overflow:hidden}
.mhead{background:var(--teal);color:#fff;padding:16px 16px 8px;border-radius:16px 16px 0 0}
.mrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.mtab{background:none;border:0;color:#fff;font-size:16px;font-weight:700;padding:8px 16px;border-radius:8px}
.mtab.on{background:var(--tab-on)}
.mtarget{background:#fff;color:var(--ink);border-radius:8px;padding:10px 16px;font-size:17px;min-width:370px}
.mbody{flex:1;overflow:auto;background:#F8F9FA;min-height:300px}
.mbody thead th{background:#fff;color:rgba(0,0,0,.5);font-size:15px;padding:16px 12px;border-bottom:0}
.mbody thead th.off{color:rgba(0,0,0,.22)}
.mbody tbody td{font-size:15px;color:var(--ink);padding:16px 12px;border-bottom:1px solid #EFEFEF;background:#fff}
.mfoot{display:flex;align-items:center;gap:16px;padding:16px 24px;background:#fff;
  border-radius:0 0 4px 4px;box-shadow:rgba(0,0,0,.16) 0 2px 3px 0}
.mfoot .b{border-radius:10px;font-size:12.8px;font-weight:400}

/* order modal — circuit 1, step 7. STELLA is the only ordering system and the
   only system of record, so the lens is typed here by hand: nothing arrives
   pre-filled from REVAI. */
.omodal{width:min(720px,100%);max-height:90vh;background:#fff;border-radius:16px 16px 4px 4px;
  display:flex;flex-direction:column;overflow:hidden}
.ohead{background:var(--teal);color:#fff;padding:16px 22px}
.ohead .t{font-size:21px;font-weight:700;line-height:28px}
.ohead .s{font-size:13px;opacity:.9;margin-top:2px;letter-spacing:.3px}
.obody{padding:22px;overflow:auto;background:#F8F9FA}
.orec{background:#fff;border:1px solid var(--line-2);border-radius:8px;padding:14px 16px;margin-bottom:18px}
.orec .k{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:700}
.orec .v{font-size:22px;font-weight:700;color:var(--ink);margin-top:4px}
.orec .m{font-size:13px;color:var(--ink-2);margin-top:2px}
.ogrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ogrid label{display:block;font-size:12px;color:var(--ink-2)}
.ogrid select,.ogrid input{width:100%;box-sizing:border-box;height:40px;margin-top:6px;
  border:1px solid var(--line-2);border-radius:6px;padding:0 10px;font-family:inherit;font-size:16px;color:var(--ink);background:#fff}
.ogrid select:focus,.ogrid input:focus{outline:2px solid var(--teal);outline-offset:-1px}
.ohint{font-size:12.5px;color:var(--ink-2);margin-top:12px;line-height:1.45}
.odiff{margin-top:18px;border:1px solid #E0A93C;background:#FFF6E5;border-radius:8px;padding:14px 16px}
.odiff .t{font-size:15px;font-weight:700;color:#8A5A00}
.odiff .x{font-size:13.5px;color:#6B4A0B;margin-top:5px;line-height:1.45}
.odiff label{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14px;color:#4A3405}
.odiff input{margin-top:2px}
.oerr{color:#C0392B;font-size:13px;margin-top:10px}
.ofoot{display:flex;align-items:center;gap:12px;padding:14px 22px;background:#fff;
  box-shadow:rgba(0,0,0,.16) 0 -1px 3px 0}
.oreceipt{background:#fff;border:1px solid var(--green-edge);border-left:4px solid var(--green);
  border-radius:8px;padding:18px 20px}
.oreceipt .no{font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.5px}
.oreceipt .rows{margin-top:14px;display:grid;gap:7px}
.oreceipt .r{display:flex;gap:14px;font-size:14px}
.oreceipt .r span{color:var(--ink-2);min-width:150px}
.oreceipt .r b{color:var(--ink);font-weight:600}
.oaudit{margin-top:16px;font-size:12px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line-2);padding-top:12px}
.empty{text-align:center;font-size:30px;padding:170px 0;color:var(--ink)}
.qty{display:inline-flex;align-items:center;gap:10px;height:34px;padding:0 8px 0 14px;

<body>
<div id="app"></div>
<div class="toasts" id="toasts"></div>
<div class="demo">DEMONSTRATION ONLY &nbsp;–&nbsp; SYNTHETIC DATA &nbsp;–&nbsp; NOT FOR CLINICAL USE</div>

<script>
/* ==================================================================
   CALCULATION ENGINE
   ------------------------------------------------------------------
   This is STAAR's own published method, not a reconstruction:

     Sarver EJ (STAAR Surgical Company). "Power Calculations for
     Spherical and Toric Phakic IOLs". In: Aramberri J, Hoffer KJ,
     Olsen T, Savini G, Shammas HJ (eds), Intraocular Lens
     Calculations, Essentials in Ophthalmology, Springer 2024,
     pp. 825-832. Open access, CC BY 4.0.
     doi:10.1007/978-3-031-50666-6_58

   It builds on the van der Heijde vergence transformation (van der
   Heijde, Fechner & Worst, Klin Monatsbl Augenheilkd 1988;193:99-102)
   and adds astigmatic decomposition, so oblique astigmatism — where
   the refractive axis and the steep corneal meridian disagree — is
   handled as vectors rather than per meridian.

   Equations used, numbered as in the chapter:
     58.12 / 58.14  astigmatic decomposition and its inverse
     58.17 / 58.18  effectivity of a power, scalar and vector form
     58.19          elp = acd + sf
     58.20          P1 = E_elp,1336{ K + CL + E_bvd,1000{S} }
     58.23          PS = E_-bvd,1000{ E_-elp,1336{ P1 - AP } - K }

   The one free parameter is the surgeon factor sf of Eq. 58.19, which
   the method itself defines as an optimisation constant. Fitted to the
   two calculation runs read out of the live system (76 rows, both
   eyes) it comes to sf = +0.236 mm. With it the model reproduces
   STELLA to the 0.01 D the interface displays: sphere 73/76 rows
   exact, cylinder 76/76 exact, worst deviation 0.006 D.

   Still a demonstration reproduction, and STAAR's production constants
   for other lens models and markets may differ. Not for clinical use.
   ================================================================== */
const CALC = {
  SF: 0.236,           // surgeon factor, Eq. 58.19  (elp = ACD + sf)
  PWR_MAX: -19.00,     // most minus selectable sphere
  PWR_MIN: -0.50,      // least minus selectable sphere
  STEP: 0.50
};
const DEG = Math.PI / 180;
/* Eq. 58.17 — effectivity of a scalar power translated d through index n */
const eff = (P, d, n) => P / (1 - d * P / n);
/* Eq. 58.12 — sphere/cylinder/axis to astigmatic decomposition */
const aDec = (s, c, th) => [s + c/2, c*Math.cos(2*th*DEG), c*Math.sin(2*th*DEG)];
/* Eq. 58.14 — inverse, returned in plus-cylinder form, axis in [0,180) */
function aInv(V){
  const c = Math.hypot(V[1], V[2]);
  let th = Math.atan2(V[2], V[1]) / 2 / DEG;
  th = ((th % 180) + 180) % 180;
  return { s: V[0] - c/2, c, th };
}
/* Eq. 58.18 — effectivity applied to an astigmatic vector */
function effV(V, d, n){
  const r = aInv(V);
  const a = eff(r.s, d, n), b = eff(r.s + r.c, d, n);
  return aDec(a, b - a, r.th);
}
const vAdd = (u,v) => [u[0]+v[0], u[1]+v[1], u[2]+v[2]];
const vSub = (u,v) => [u[0]-v[0], u[1]-v[1], u[2]-v[2]];
/* Eq. 58.13 — keratometry given as two powers with their axes */
function kVector(K1, a1, K2, a2){
  const steep = Math.max(K1,K2), flat = Math.min(K1,K2);
  const steepAxis = (K1 >= K2) ? a1 : a2;
  return aDec(steep, flat - steep, steepAxis);
}

/* Full selectable-power table for one eye, or null if the inputs are
   not yet complete enough to compute. */
function computeSeries(f, cylPower, toric){
  const S = parseFloat(f.sph), C = parseFloat(f.cyl) || 0;
  const bvd = parseFloat(f.bvd), acd = parseFloat(f.acd);
  const K1 = parseFloat(f.k1), K2 = parseFloat(f.k2);
  const a1 = parseFloat(f.k1a), a2 = parseFloat(f.k2a);
  const axis = parseFloat(f.axis);
  if([S,bvd,acd,K1,K2,a1,a2,axis].some(v => isNaN(v))) return null;
  if(K1 < 20 || K1 > 70 || K2 < 20 || K2 > 70 || bvd < 0 || acd <= 0) return null;

  const elp = acd + CALC.SF;                                   // Eq. 58.19
  const Svec = aDec(S, C, axis);
  const Kvec = kVector(K1, a1, K2, a2);
  const P1 = effV(vAdd(Kvec, effV(Svec, bvd, 1000)), elp, 1336);   // Eq. 58.20
  if(!P1.every(isFinite)) return null;

  const nominalCyl = toric ? (parseFloat(String(cylPower).replace(/\s/g,'')) || 0) : 0;
  const rows = [];
  for(let x = CALC.PWR_MAX; x <= CALC.PWR_MIN + 1e-9; x += CALC.STEP){
    const sel = Math.round(x*100)/100;
    const AP = aDec(sel, nominalCyl, axis);                    // toric aligned to the axis
    const PS = effV(vSub(effV(vSub(P1, AP), -elp, 1336), Kvec), -bvd, 1000);  // Eq. 58.23
    const r = aInv(PS);
    if(!isFinite(r.s) || !isFinite(r.c)) return null;
    rows.push({
      sph: fmtD(sel, true), cyl: fmtD(nominalCyl),
      sphExp: fmtD(r.s, true), cylExp: fmtD(r.c, true),
      axExp: String(Math.round(r.th) % 180).padStart(3, '0'),
      sec: fmtD(r.s + r.c/2, true)
    });
  }
  /* power that lands closest to plano, for reference */
  const K0 = aInv(Kvec).s;
  rows.required = P1[0] - effV(Kvec, elp, 1336)[0];
  return rows;
}
/* STELLA prints powers with a sign: sphere/cylinder as +0.50,
   expected values zero-padded as +00.43 / -15.90 */
function fmtD(v, wide){
  const s = v < 0 ? '-' : '+';
  const a = Math.abs(v);
  if(wide) return s + (a < 10 ? '0' : '') + a.toFixed(2);
  return s + a.toFixed(2);
}

/* Paginación real: cada tabla lleva su propia página en S.page, y las filas se
   cortan con pageRows(). El pager se dibuja a partir del total de filas. */
const PER_PAGE = 5;
const pageOf = (id, total, per) => {
  const last = Math.max(1, Math.ceil(total / (per || PER_PAGE)));
  return Math.min(Math.max(1, S.page[id] || 1), last);
};
const pageRows = (id, rows, per) => {
  const n = per || PER_PAGE, cur = pageOf(id, rows.length, n);
  return rows.slice((cur - 1) * n, cur * n);
};
const pager = (id, total, per) => {
  const n = per || PER_PAGE;
  const last = Math.max(1, Math.ceil(total / n)), cur = pageOf(id, total, n);
  const btn = (label, to, on, off) =>
    `<button ${off ? 'disabled' : `data-page="${id}:${to}"`}${on ? ' class="on"' : ''}
      ${label === '«' ? 'aria-label="First page"' : label === '»' ? 'aria-label="Last page"' : ''}>${label}</button>`;
  /* con muchas páginas se muestra una ventana alrededor de la actual */
  let from = 1, to = last;
  if (last > 7) { from = Math.max(1, Math.min(cur - 3, last - 6)); to = Math.min(last, from + 6); }
  const nums = [];
  for (let i = from; i <= to; i++) nums.push(btn(String(i), i, i === cur, false));
  return `<div class="pager" role="navigation" aria-label="Pagination">
    ${btn('«', 1, false, cur === 1)}${btn('‹', cur - 1, false, cur === 1)}
    ${nums.join('')}
    ${btn('›', cur + 1, false, cur === last)}${btn('»', last, false, cur === last)}</div>`;
};

/* Reserved-lens divergence marker.
   STELLA paints, inside the reserved prescription, only the tokens that differ from
   the target: sphere, cylinder and axis are compared one by one and the ones that do
   not match come out red. There is no legend and no tooltip on the live app - the
   colour is the whole signal - so this reproduces exactly that and nothing more.
   Values are compared numerically, because target and reserved are not always written
   with the same precision ('x70' vs 'x082', '+2.50' vs '2.5'). */
function rxDiff(trx, lrx){
  if(!lrx) return '';
  if(!trx) return lrx;
  const num = t => { const m = String(t).match(/-?\d+(?:\.\d+)?/); return m ? parseFloat(m[0]) : null; };
  const tail = lrx.match(/\s#\S+$/);                    // '#T2805516' de la vista de orden
  const body = tail ? lrx.slice(0, -tail[0].length) : lrx;
  const tt = trx.trim().split(/\s+/), lt = body.trim().split(/\s+/);
  const out = lt.map((tok,i) => {
    const a = num(tok), b = num(tt[i]);
    const differs = a === null || b === null ? tok !== tt[i] : a !== b;
    return differs ? `<span class="rxdiff">${tok}</span>` : tok;
  }).join(' ');
  return out + (tail ? tail[0] : '');
}

/* Eye artwork: the iris dial and the anterior-segment cross-section are a static
   image layer. Everything drawn on top of them — degree lines, axis pills, the
   measurement boxes — is an overlay computed from the pre-op inputs. */
const EYE_ART = { dial:'/assets/eye/iris_dial.webp', cross:'/assets/eye/anterior_segment.webp' };

function cornea(eye){
  const f = S.fields[eye];
  const k1 = parseFloat(f.k1a), k2 = parseFloat(f.k2a), cyl = parseFloat(f.axis);
  /* Geometry locked to the artwork: R is the limbus radius inside the dial image. */
  const CX = 195, CY = 175, HALF = 125, R = 104, SQ = 138;
  const C = { k1:'#19A519', k2:'#2A2AEE', cyl:'#F2F4F6', pk1:'#0F8A0F', pk2:'#1717C8',
              teal:'#2AA3B5', grey:'#9AA0A6', line:'#6E7378', boxln:'#5B6065' };

  const axis = (deg,color,dash,w) => {
    if(isNaN(deg)) return '';
    const r = deg*Math.PI/180, dx = R*Math.cos(r), dy = R*Math.sin(r);
    return `<line x1="${(CX+dx).toFixed(1)}" y1="${(CY-dy).toFixed(1)}"
      x2="${(CX-dx).toFixed(1)}" y2="${(CY+dy).toFixed(1)}"
      stroke="${color}" stroke-width="${w||3.4}" stroke-linecap="round"
      ${dash?'stroke-dasharray="11 8"':''}/>`;
  };
  const tag = (deg,color) => {
    if(isNaN(deg)) return '';
    const r = deg*Math.PI/180;
    return `<g transform="translate(${(CX+R*Math.cos(r)).toFixed(1)},${(CY-R*Math.sin(r)).toFixed(1)}) rotate(${(-deg).toFixed(0)})">
      <rect x="-19" y="-10.5" width="38" height="21" rx="2.5" fill="${color}"/>
      <text x="0" y="4.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">${deg}°</text></g>`;
  };
  const box = (x,y,w,h,lines,val,unit) => `<g>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#1E1F22" fill-opacity=".62"
      stroke="${C.boxln}" stroke-width="1"/>
    ${lines.map((t,i)=>`<text x="${x+9}" y="${y+15+i*12.5}" font-size="10.5" fill="#C6CACE">${t}</text>`).join('')}
    ${val?`<text x="${x+9}" y="${y+h-9}" font-size="11.5" font-weight="700" fill="#fff">${val} ${unit}</text>`:''}
  </g>`;
  const legendRow = (y,color,dash,label) => `
    <line x1="18" y1="${y}" x2="44" y2="${y}" stroke="${color}" stroke-width="2.4"
      ${dash?'stroke-dasharray="6 4"':''}/>
    <text x="51" y="${y+3.5}" font-size="10.5" fill="#C6CACE">${label}</text>`;

  return `<svg viewBox="0 0 570 350" style="width:100%;height:auto;display:block">
    <!-- base artwork -->
    <image href="${EYE_ART.dial}" x="${CX-HALF}" y="${CY-HALF}" width="${HALF*2}" height="${HALF*2}"
      ${eye==='os'?`transform="translate(${CX*2},0) scale(-1,1)"`:''}/>
    <image href="${EYE_ART.cross}" x="470" y="26" width="122" height="298" preserveAspectRatio="xMinYMid slice"/>

    <!-- overlay: orientation frame -->
    <rect x="${CX-SQ}" y="${CY-SQ}" width="${SQ*2}" height="${SQ*2}" fill="none"
      stroke="${C.line}" stroke-width="1" stroke-dasharray="4 5"/>
    <text x="${CX}" y="26" text-anchor="middle" fill="${C.teal}" font-size="17" font-weight="700">S</text>
    <text x="${CX}" y="340" text-anchor="middle" fill="${C.teal}" font-size="17" font-weight="700">I</text>
    <text x="24" y="181" fill="${C.teal}" font-size="17" font-weight="700">${eye==='od'?'T':'N'}</text>
    <text x="360" y="181" text-anchor="end" fill="${C.teal}" font-size="17" font-weight="700">${eye==='od'?'N':'T'}</text>
    <text x="${CX}" y="50" text-anchor="middle" fill="${C.grey}" font-size="10">90°</text>
    <text x="62" y="179" text-anchor="end" fill="${C.grey}" font-size="10">180°</text>
    <text x="326" y="179" fill="${C.grey}" font-size="10">0°</text>
    <text x="${CX}" y="313" text-anchor="middle" fill="${C.grey}" font-size="10">270°</text>

    <!-- overlay: axes driven by the inputs -->
    ${axis(cyl,C.cyl,false,2.2)}${axis(k1,C.k1,true)}${axis(k2,C.k2,true)}
    ${tag(k1,C.pk1)}${tag(k2,C.pk2)}

    <!-- overlay: measurements -->
    ${box(360,26,94,66,['Central','Corneal','Thickness'],f.cct,'µm')}
    ${box(360,258,94,66,['Anterior','Chamber','Depth'],f.acd,'mm')}
    ${box(14,190,84,66,['White','to','White'],f.ww,'mm')}
    <line x1="454" y1="59" x2="466" y2="59" stroke="${C.boxln}" stroke-width="1"/>
    <line x1="454" y1="291" x2="466" y2="291" stroke="${C.boxln}" stroke-width="1"/>
    <line x1="98" y1="223" x2="${CX-R-6}" y2="223" stroke="${C.boxln}" stroke-width="1"/>

    <!-- overlay: legend -->
    <rect x="8" y="272" width="170" height="64" fill="#1E1F22" fill-opacity=".62"
      stroke="${C.boxln}" stroke-width="1"/>
    ${legendRow(290,C.k1,true,'K1 Axis')}
    ${legendRow(306,C.k2,true,'K2 Axis')}
    ${legendRow(322,C.cyl,false,'CYL Axis (Refr.)')}
  </svg>`;
}
function eyeDiagram(eye){
  const live = S.eye===eye;
  const showPrompt = live && !S.calculated && S.focus && S.focus.eye===eye;
  return `<div class="diagram ${live?'':'dim'}" data-diag="${eye}">
    <div class="tag">${eye.toUpperCase()}</div>
    ${cornea(eye)}
    ${showPrompt?`<div class="prompts"><div class="t">PROMPTS</div>
      <div class="x">${FIELDS[S.focus.key].prompt}</div></div>`:''}
    ${live?'':`<div class="editmask" data-editeye="${eye}"><span>EDIT ${eye.toUpperCase()}</span></div>`}
  </div>`;
}
function fld(eye,key,w){
  const meta = FIELDS[key];
  const live = S.eye===eye && !S.calculated;
  const v = S.fields[eye][key] || '';
  const cap = `<span class="cap">${meta.cap}</span>`;
  if(!live) return `<div class="fld"><div class="ro">${v
    ? `<span>${v}</span><span style="font-size:11px;color:var(--muted);font-weight:400">${meta.unit}</span>`
    : `<span style="font-size:11px;color:var(--muted)">${meta.unit}</span>`}</div>${cap}</div>`;
  const focused = S.focus && S.focus.eye===eye && S.focus.key===key;
  return `<div class="fld"><span class="pill">
    <input data-f="${eye}:${key}" value="${v}" class="${v?'ok':''}">
    <span class="u">${meta.unit}</span></span>${cap}
    ${focused?`<span class="range">${meta.range}${v?' <span style="color:#6BE39A">✔</span>':''}</span>`:''}
  </div>`;
}
function refractionBox(eye){
  const live = S.eye===eye && !S.calculated;
  const exp = S.expanded[eye], sel = S.refrMode[eye];
  const manifest = `<div class="refrow">
    ${exp?`<span class="radio ${sel==='manifest'?'on':''}" data-refr="${eye}:manifest"></span>`:''}
    <div class="fields" style="margin-top:0">
      ${fld(eye,'sph')}${fld(eye,'cyl')}${fld(eye,'axis')}${fld(eye,'bvd')}</div></div>`;
  const cl = `<div class="refrow">
    <span class="radio ${sel==='cl'?'on':''}" data-refr="${eye}:cl"></span>
    <div class="fields" style="margin-top:0">
      ${fld(eye,'sphCL')}${fld(eye,'cylCL')}${fld(eye,'axisCL')}${fld(eye,'bvdCL')}${fld(eye,'sphCLx')}</div></div>`;
  return `<div class="fbox refbox">
    <div class="refhead">
      <div><span class="rlabel">REFRACTION: <u>MANIFEST</u></span>
        <span style="color:var(--muted-2)"> | </span>
        <span class="slabel grey" style="display:${exp?'none':'inline'}">CL OVER-REFRACTION</span></div>
      ${live?`<button class="b b-primary" style="margin-left:auto;flex:none" data-exp="${eye}">${exp?'CONTRACT':'EXPAND'}</button>`
            :`<span class="expghost" aria-hidden="true"></span>`}
    </div>
    <div style="margin-top:12px">${manifest}</div>
    ${exp?`<div style="margin-top:18px">
      <span class="rlabel">REFRACTION</span> <span class="slabel grey">CL OVER-REFRACTION</span>
      <div style="margin-top:8px">${cl}</div></div>`:''}
  </div>`;
}
function calcForBox(eye){
  const live = S.eye===eye && !S.calculated, toric = S.mode[eye]==='TORIC';
  if(!live) return `<div class="fbox calcbox">
    <div class="slabel">CALCULATE FOR</div>
    <div style="font-size:16px;margin-top:10px">${toric?'TICL':'ICL'}</div></div>`;
  return `<div class="fbox calcbox">
    <div class="slabel">CALCULATE FOR</div>

}
/* The two eyes are laid out as two rows of a shared grid — refraction on one row,
   biometry on the next — so OD and OS stay aligned even though the live eye carries

function eyeHeaderRow(eye){

      </div>
      <div class="eyeboxes">${refractionBox(eye)}${calcForBox(eye)}</div>

}
function biometryBox(eye){

function resultPanel(eye){

/* ==================================================================
   REVAI / EVO CONNECT HANDOFF (circuit 1, step 2) — ADR-0001/0002/0003
   as amended by DR-0004 (sponsor round 2): EVO-branded launch, eye

   Approved strings kept: C3 boundary line. STELLA reads nothing back:
   no location, no storage reads, no referrer.

const RV_HERO = { kicker:'EVO Connect by STAAR',

function revaiTopBanner(){

  if(S.rv.banner==='min') return `<button type="button" class="rv-top rv-top-min" data-act="rv-reopen"

    </div>

function b64url(str){
  return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
/* v1.1 schema (DR-0004): whitelisted keys only; inputs as typed in STELLA (strings). */
function buildHandoff(lat){
  const eyes = lat==='ou' ? ['od','os'] : [lat];
  const eyeBlock = eye => {
    const f = S.fields[eye], rows = S.results[eye], pick = S.pick[eye];
    const inputs = {}; ['sph','cyl','axis','bvd','k1','k1a','k2','k2a','acd','cct','ww'].forEach(k => { inputs[k] = String(f[k]); });
    return { inputs, stella:{
      size:String(S.targetLength[eye]), model:S.mode[eye]==='TORIC' ? 'Toric Myopic' : 'Myopic',
      power:(pick!=null && rows && rows[pick]) ? {sph:rows[pick].sph, cyl:rows[pick].cyl, axis:rows[pick].axExp} : null,
      cylPower:S.cylPower[eye], formula:'Calculator V8.00 OUS', calculatedAt:S.calculatedAt } };
  };
  const out = { v:1.1, caseId:S.pid, laterality:lat.toUpperCase(), sentAt:new Date().toISOString(),
    source:{system:'STELLA', version:'Calculator V8.00 OUS'}, eyes:{} };
  eyes.forEach(e => { out.eyes[e] = eyeBlock(e); });
  return out;
}
function launchRevai(lat){
  const eyes = lat==='ou' ? ['od','os'] : [lat];
  if(!S.calculated || !S.results || !eyes.every(e => S.results[e])){ toast('Not calculated','Press Save and Calculate first.'); return; }
  const payload = b64url(JSON.stringify(buildHandoff(lat)));
  if(payload.length > HANDOFF_MAX_CHARS){ toast('Handoff too large','The case could not be transferred.'); return; }
  /* new tab (DR-0004): sessionStorage is per-tab, so the URL is the carrier; a short-lived
     localStorage handshake lets the new tab recover the case if its URL is cleaned. Write-only. */
  try { localStorage.setItem('stella_handoff_pending', JSON.stringify({p:payload, ts:Date.now()})); } catch(e){}
  window.open('/dashboard?handoff=' + payload, '_blank', 'noopener');
  S.rv.pick = false; S.rv.eye = null; render();
}

/* ==================================================================
   ORDER MODAL — circuit 1, step 7
   STELLA creates, validates, records and audits the official order and is
   the only ordering system. Nothing arrives here from REVAI: the surgeon
   types the lens by hand, and any divergence from the STELLA recommendation
   has to be confirmed explicitly before the order can be placed.

const ORDER_KEY = 'stella_order_confirmed';
const ORDER_SIZES = ['12.1','12.6','13.2','13.7'];

function stellaRec(eye){
  const rows = S.results && S.results[eye], pick = S.pick[eye];
  const r = (pick!=null && rows) ? rows[pick] : null;
  return { size:S.targetLength[eye], model:S.mode[eye]==='TORIC'?'Toric Myopic':'Myopic',
           power:r?r.sph:null, cyl:r?r.cyl:null, axis:r?r.axExp:null, formula:'Calculator V8.00 OUS' };
}

          <div class="r"><span>STELLA recommendation</span><b>${done.stella.size} mm · ${done.stella.model}</b></div>
          <div class="r"><span>Divergence</span><b>${done.divergent?done.delta+' mm — confirmed by the surgeon':'none — recommendation accepted'}</b></div>
          <div class="r"><span>Confirmed</span><b>${done.confirmedAt.replace('T',' ').slice(0,16)} UTC</b></div>
          <div class="r"><span>Confirmed by</span><b>${SURGEON.full}</b></div>
        </div>

  }

  const size = o.size||'', power = o.power||'', axis = o.axis||'';

  return `<div class="scrim" data-oscrim="1"><div class="omodal">${head}

function placeOrder(){
  const o = S.order, eye = o.eye, R = stellaRec(eye);
  if(!o.size){ o.err = 'Select the lens size you are ordering.'; render(); return; }
  if(!o.power){ o.err = 'Enter the lens power.'; render(); return; }
  const diverges = o.size !== String(R.size);
  if(diverges && !o.ack){ o.err = 'Confirm the difference with the STELLA recommendation before placing the order.'; render(); return; }
  o.err = null;
  const rec = {
    caseId: patient().pid, eye: eye.toUpperCase(),
    orderNo: String(760000 + Math.floor(Math.random()*9000)),
    lens: { size:o.size, power:o.power, axis:o.axis||null },
    stella: { size:String(R.size), model:R.model, formula:R.formula },
    divergent: diverges, delta: diverges ? ((parseFloat(o.size)-parseFloat(R.size)>=0?'+':'')+(parseFloat(o.size)-parseFloat(R.size)).toFixed(1)) : '0.0',
    confirmedBy: SURGEON.full, confirmedAt: new Date().toISOString(), system: 'STELLA'
  };
  S.orders[eye] = rec;
  /* step 8 — the confirmed order travels STELLA → REVAI. One direction only. */
  try {
    const all = JSON.parse(localStorage.getItem(ORDER_KEY) || '{}');
    all[rec.caseId + '|' + rec.eye] = rec;
    localStorage.setItem(ORDER_KEY, JSON.stringify(all));
  } catch(e){}
  render();
}

/* ==================================================================
   ADD NEW PATIENT — writes into the in-memory PATIENTS array, so a
   patient created here survives navigation for the whole session.
   Nothing is persisted to disk or to any database.
   ================================================================== */
const NEW_BLANK = () => ({pid:'',first:'',last:'',y:'',m:'',d:'',sex:'',note:'',active:true,priority:false});
function ageFrom(y,m,d){
  const Y=+y,M=+m,D=+d;
  if(!Y||!M||!D||String(y).length!==4) return null;
  const dob=new Date(Y,M-1,D);
  if(dob.getFullYear()!==Y||dob.getMonth()!==M-1||dob.getDate()!==D) return null;
  const now=new Date(2026,8,1);
  let a=now.getFullYear()-Y;
  if(now.getMonth()<M-1 || (now.getMonth()===M-1 && now.getDate()<D)) a--;
  return (a>=0 && a<130) ? a : null;
}
function viewNewPatient(){
  const n = S.newp, age = ageFrom(n.y,n.m,n.d);
  const bad = k => S.newpTried && !String(n[k]).trim();
  const fs = k => `height:36px;border:1px solid ${bad(k)?'var(--invalid)':(String(n[k]).trim()?'var(--green-ok)':'var(--line-2)')};`
    + 'border-radius:4px;padding:0 10px;font-family:inherit;font-size:15px;background:#fff;color:var(--ink)';
  const dobBad = S.newpTried && age===null;
  const dfs = 'height:36px;border:1px solid '+(dobBad?'var(--invalid)':(age!==null?'var(--green-ok)':'var(--line-2)'))
    + ';border-radius:4px;padding:0 10px;font-family:inherit;font-size:15px;width:70px';
  const radio = v => `<div style="cursor:pointer" data-np-sex="${v}"><span class="radio ${n.sex===v?'on':''}"></span> ${v}</div>`;
  return topbar() + `<div class="pbanner" style="min-height:96px">
      <button class="back" data-act="cancelnew">‹</button>
      <div><div class="lbl">Patient ID (Name: Last, First)</div>
        <div style="display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-top:6px">
          <span class="pid" style="font-size:26px;line-height:32px">${n.pid||''}</span>
          <span class="pname" style="font-size:18px;line-height:24px">${(n.last||n.first)
            ? `${n.last}${n.last&&n.first?',&nbsp; ':''}${n.first}${n.sex?' &nbsp;('+n.sex[0]+')':''}` : ''}</span></div>
      </div>
      <div style="padding-top:2px;white-space:nowrap">
        <span class="age">${age!==null?`${n.y}-${String(n.m).padStart(2,'0')}-${String(n.d).padStart(2,'0')}`:'0/0/0'}</span>
        <b class="age" style="margin-left:8px">${age!==null?age:''} yrs</b></div>
      <div style="padding-top:2px"><span class="lbl">Surgeon</span>
        <b style="margin-left:8px;font-size:13px;letter-spacing:.5px">${SURGEON.full.toUpperCase()}</b></div>
      <div style="padding-top:2px;max-width:250px"><span class="lbl">Notes</span>
        ${n.note?`<div style="font-size:15px;line-height:1.22;margin-top:4px">${n.note}</div>`:''}</div>
    </div>
    <div class="wrap"><div class="card" style="margin-top:24px;max-width:960px">
      <div class="slabel" style="margin-bottom:16px">PERSONAL</div>
      <div class="personal">
        <label>Patient ID<br><input data-np="pid" value="${n.pid}" style="${fs('pid')};width:220px;margin-top:6px"></label>
        <div>Patient Status<div style="margin-top:14px;display:flex;gap:14px;align-items:center;font-size:15px;color:var(--ink)">
          <span class="tg ${n.active?'on':''}" data-np-tg="active"></span> Active
          <span class="tg ${n.priority?'on':''}" data-np-tg="priority"></span> Priority</div></div>
        <div></div><div></div>
        <label>First name<br><input data-np="first" value="${n.first}" style="${fs('first')};width:220px;margin-top:6px"></label>
        <label>Date of birth (YYYY-MM-DD)<br><span style="display:flex;gap:8px;margin-top:6px">
          <input data-np="y" value="${n.y}" placeholder="Year" maxlength="4" style="${dfs}">
          <input data-np="m" value="${n.m}" placeholder="Month" maxlength="2" style="${dfs}">
          <input data-np="d" value="${n.d}" placeholder="Day" maxlength="2" style="${dfs}"></span></label>
        <div style="font-size:15px;color:${S.newpTried&&!n.sex?'var(--invalid)':'var(--ink)'};align-self:center">
          ${radio('Male')}${radio('Female')}${radio('Other')}</div>
        <label>Notes (optional)<br><textarea data-np="note" maxlength="200"
          style="${fs('note')};width:290px;height:74px;padding:8px;margin-top:6px">${n.note}</textarea></label>
        <label>Last name<br><input data-np="last" value="${n.last}" style="${fs('last')};width:220px;margin-top:6px"></label>
        <label>Surgeon<br><input value="${SURGEON.full}" readonly
          style="height:36px;border:1px solid var(--line-2);border-radius:4px;background:var(--page);
          padding:0 10px;font-family:inherit;font-size:15px;width:250px;margin-top:6px"></label>
      </div>
      <div style="display:flex;gap:12px;margin-top:22px">
        <button class="b b-outline b-lg" data-act="cancelnew">Cancel</button>
        <button class="b b-primary b-lg" data-act="savenew">Save</button></div>
    </div></div>` + siteFooter();
}

          <img src="${ASSETS.blockEU}" width="212" height="45" alt="ICL/TICL Calculator/IOD Software V8.00">
          <img src="${ASSETS.blockCA}" width="192" height="45" alt="Canadian License Name">
        </div>
      </div>
    </div>
  </div>`;
}

/* ==================================================================
   RENDER + EVENTS
   ================================================================== */
const VIEWS = {
  dashboard:viewDashboard, patients:viewPatients, patient:viewPatient, preop:viewPreop,
  orders:viewOrders, 'order-detail':viewOrderDetail, reservations:viewReservations,
  surgeons:viewSurgeons, 'patient-new':viewNewPatient, login:viewLogin
};
function render(){
  app.innerHTML = (VIEWS[S.route]||viewDashboard)() + inventory() + selector() + orderModal();
  if(S.route==='preop' && S.calculated) centreRows();
  if(S.focus){
    const el = document.querySelector(`[data-f="${S.focus.eye}:${S.focus.key}"]`);
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
}
function centreRows(){
  ['od','os'].forEach(eye=>{
    const sc = document.getElementById('sc-'+eye);
    if(!sc) return;
    const rows = S.results[eye];
    if(!rows) return;
    const target = parseFloat(S.fields[eye].sph);
    let idx = rows.findIndex(r => Math.abs(parseFloat(r.sph)-target) < 0.26);
    if(idx < 0) idx = 5;
    sc.scrollTop = Math.max(0, (idx-2)*47);
  });
}

/* focus drives PROMPTS + the range tooltip */
document.addEventListener('focusin', e => {
  const f = e.target.dataset && e.target.dataset.f;
  if(!f) return;
  const p = f.split(':');
  if(S.focus && S.focus.eye===p[0] && S.focus.key===p[1]) return;
  S.focus = {eye:p[0], key:p[1]};
  render();
});
document.addEventListener('focusout', e => {
  if(!(e.target.dataset && e.target.dataset.f)) return;
  setTimeout(()=>{ if(!document.activeElement || !document.activeElement.dataset || !document.activeElement.dataset.f){
    S.focus = null; if(S.route==='preop') render(); } }, 60);
});
/* typing updates the model + diagram without losing the caret */
document.addEventListener('input', e => {
  const f = e.target.dataset && e.target.dataset.f;
  if(!f) return;
  const p = f.split(':'), eye = p[0], key = p[1];
  S.fields[eye][key] = e.target.value;
  e.target.classList.toggle('ok', e.target.value.trim()!=='');
  const diag = document.querySelector('[data-diag="'+eye+'"]');
  if(diag) diag.outerHTML = eyeDiagram(eye);
  const tip = e.target.closest('.fld').querySelector('.range');
  if(tip) tip.innerHTML = FIELDS[key].range + (e.target.value?' <span style="color:#6BE39A">✔</span>':'');
  const ready = eyeReady('od') || eyeReady('os');
  document.querySelectorAll('.bbtn').forEach(b => { b.disabled = !ready || S.calculated; });
});

/* order modal: size and the divergence acknowledgement re-render (they drive the
   confirmation panel); power and axis are kept silently so the caret stays put */
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.o;
  if(!k || !S.order) return;
  if(k === 'ack'){ S.order.ack = e.target.checked; S.order.err = null; render(); return; }
  if(k === 'size'){ S.order.size = e.target.value; S.order.ack = false; S.order.err = null; render(); return; }
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.o;
  if(!k || !S.order) return;
  if(k === 'power' || k === 'axis') S.order[k] = e.target.value;
});

/* new-patient form: update the model and the live banner, keep the caret */
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.np;
  if(!k) return;
  let v = e.target.value;
  if(k==='y'||k==='m'||k==='d') v = v.replace(/\D/g,'');
  if(v !== e.target.value) e.target.value = v;
  S.newp[k] = v;
  const holder = document.querySelector('.pbanner');
  if(holder){
    const tmp = document.createElement('div');
    tmp.innerHTML = viewNewPatient();
    const nb = tmp.querySelector('.pbanner');
    if(nb) holder.innerHTML = nb.innerHTML;
  }
});

document.addEventListener('keydown', e => {
  if(e.key!=='Enter' && e.key!==' ') return;
  const b = e.target.closest && e.target.closest('.preop-branch');
  if(b){ e.preventDefault(); b.click(); }
});
document.addEventListener('click', e => {
  const sel = '[data-go],[data-patient],[data-order],[data-tab],[data-pop],[data-act],[data-editeye],'
            + '[data-exp],[data-refr],[data-mode],[data-tg],[data-flip],[data-reset],[data-pick],'
            + '[data-alt],[data-len],[data-cyl],[data-save],[data-cancel],[data-inv],[data-mtab],'
            + '[data-scrim],[data-selscrim],[data-np-sex],[data-np-tg],[data-neworder],[data-oscrim],[data-page]';
  const t = e.target.closest(sel);
  if(!t){ if(S.pop || S.usermenu){ S.pop=null; S.usermenu=false; render(); } return; }
  const d = t.dataset;
  if((d.scrim!==undefined || d.selscrim!==undefined || d.oscrim!==undefined) && e.target !== t) return;
  if(d.oscrim!==undefined){ S.order = null; render(); return; }
  if(d.neworder){ S.order = { eye:d.neworder, size:'', power:'', axis:'', ack:false, err:null }; render(); return; }
  if(d.page){ const [id, n] = d.page.split(':'); S.page[id] = parseInt(n,10) || 1;
              const y = window.scrollY; render(); window.scrollTo(0, y); return; }

  if(d.npSex){ S.newp.sex = d.npSex; render(); return; }
  if(d.npTg){ S.newp[d.npTg] = !S.newp[d.npTg]; render(); return; }
  if(d.flip){ t.classList.toggle('on'); return; }
  if(d.go){ if(S.route==='login' && d.go==='dashboard'){ setSession(true);
        if(deepPid){ S.pid = deepPid; S.tab='lens'; loadFields(); go('patient'); return; } }
            if(d.go==='preop') loadFields();
            if(d.go==='patient-new'){ S.newp = NEW_BLANK(); S.newpTried = false; }
            go(d.go); return; }
  if(d.patient){ S.pid=d.patient; S.tab='lens'; loadFields(); go('patient'); return; }
  if(d.order){ S.orderN=d.order; go('order-detail'); return; }
  if(d.tab){ S.tab=d.tab; render(); return; }
  if(d.pop!==undefined && !d.act){ S.pop = (S.pop===d.pop || d.pop==='') ? null : d.pop; render(); return; }

  if(d.act){
    switch(d.act){
      case 'usermenu': S.usermenu = !S.usermenu; render(); return;
      case 'logout':   setSession(false); go('login'); return;
      case 'selector': S.selector = true; render(); return;
      case 'closesel': S.selector = false; render(); return;
      case 'nologin':  toast('Sign-in disabled','This is a demonstration reproduction.'); return;
      case 'closeorder': S.order = null; render(); return;
      case 'placeorder': placeOrder(); return;
      case 'newpreop':
      case 'opencalc': loadFields(); go('preop'); return;

      case 'savepre':  toast('Pre-op data saved','Demonstration only — nothing was written.', true); return;
      case 'calc': {
        const od = eyeReady('od') ? computeSeries(S.fields.od, S.cylPower.od, S.mode.od==='TORIC') : null;
        const os = eyeReady('os') ? computeSeries(S.fields.os, S.cylPower.os, S.mode.os==='TORIC') : null;
        if(!od && !os){ toast('Calculation failed','Check the refraction and biometry values.'); return; }
        S.results = { od, os };
        S.targetLength = { od:recommendLength(S.fields.od.ww), os:recommendLength(S.fields.os.ww) };
        S.calculated = true; S.calculatedAt = new Date().toISOString(); S.focus = null;
        S.pick = {od:null,os:null}; S.savedTarget = {od:false,os:false};
        render();
        setTimeout(()=>{const el=document.querySelector('.reshead'); if(el) el.scrollIntoView({behavior:'smooth',block:'center'});},80);
        return;
      }
      case 'rv-pick':  S.rv.pick = !S.rv.pick; render(); return;
      case 'rv-eye':   S.rv.eye = d.eye; render(); return;
      case 'rv-go':    if(S.rv.eye) launchRevai(S.rv.eye); return;
      case 'rv-dismiss': S.rv.banner = 'min'; render(); return;
      case 'rv-reopen':  S.rv.banner = 'open'; S.rv.entered = false; render(); return;
      case 'print':    toast('Printing disabled','Report generation is not part of this demonstration.'); return;
      case 'reserve':  toast('Reservation blocked','Reservations and official orders are created inside STELLA only.'); return;
      case 'make':     toast('Manufacture request disabled','Not part of this demonstration.'); return;
      case 'closeinv': S.inv = null; render(); return;
      case 'cancelnew': S.newp = NEW_BLANK(); S.newpTried = false; go('patients'); return;
      case 'savenew': {
        const n = S.newp, age = ageFrom(n.y,n.m,n.d);
        const missing = ['pid','first','last'].filter(k=>!String(n[k]).trim());
        if(missing.length || age===null || !n.sex){
          S.newpTried = true; render();
          toast('Patient could not be saved',
            'Complete Patient ID, First name, Last name, a valid date of birth and gender.');
          return;
        }
        if(PATIENTS.some(p => p.pid.toLowerCase() === n.pid.trim().toLowerCase())){
          S.newpTried = true; render();
          toast('Duplicate Patient ID','A patient with this ID already exists in this session.');
          return;
        }
        const dob = `${n.y}-${String(n.m).padStart(2,'0')}-${String(n.d).padStart(2,'0')}`;
        PATIENTS.unshift({
          pid:n.pid.trim(), last:n.last.trim(), first:n.first.trim(), dob, age,
          sex:n.sex==='Male'?'M':(n.sex==='Female'?'F':'O'),
          act:'2026-09-01', note:n.note.trim(), priority:n.priority,
          od:BLANK_EYE(), os:BLANK_EYE(), runs:[],
          saved:{ od:{calc:'',rx:'',lens:'',lrx:'',state:'',ord:'',sn:''},
                  os:{calc:'',rx:'',lens:'',lrx:'',state:'',ord:'',sn:''} },
          bookings:[], orders:[]
        });
        S.pid = n.pid.trim(); S.tab = 'lens';
        S.newp = NEW_BLANK(); S.newpTried = false;
        loadFields(); go('patient');
        toast('Patient saved', `${S.pid} was added for this session.`, true);
        return;
      }
    }
  }
  if(d.editeye){ S.eye=d.editeye; S.focus=null; render(); return; }
  if(d.exp){ S.expanded[d.exp] = !S.expanded[d.exp]; render(); return; }
  if(d.refr){ const p=d.refr.split(':'); S.refrMode[p[0]]=p[1]; render(); return; }
  if(d.mode){ const p=d.mode.split(':'); S.mode[p[0]]=p[1]; render(); return; }
  if(d.tg){ const p=d.tg.split(':'); S[p[0]][p[1]] = !S[p[0]][p[1]]; render(); return; }
  if(d.reset){ S.fields[d.reset] = BLANK_EYE(); S.focus=null; render(); return; }
  if(d.pick){ const p=d.pick.split(':'); S.pick[p[0]] = Number(p[1]); render(); return; }
  if(d.alt){ S.altLength[d.alt] = !S.altLength[d.alt]; render(); return; }
  if(d.len){
    const p=d.len.split(':');
    let i = LENGTHS.indexOf(S.targetLength[p[0]]);
    i = Math.min(LENGTHS.length-1, Math.max(0, i + Number(p[1])));
    S.targetLength[p[0]] = LENGTHS[i]; render(); return;
  }
  if(d.cyl){
    const p=d.cyl.split(':');
    const v = Math.min(6, Math.max(0.5, parseFloat(S.cylPower[p[0]].replace(/\s/g,'')) + Number(p[1])*0.5));
    S.cylPower[p[0]] = '+ '+v.toFixed(2);
    if(S.calculated && eyeReady(p[0]))
      S.results[p[0]] = computeSeries(S.fields[p[0]], S.cylPower[p[0]], S.mode[p[0]]==='TORIC');
    render(); return;
  }
  if(d.save){ S.savedTarget[d.save] = true; render();
    toast('Target lens saved','Demonstration only — nothing was written.', true); return; }
  if(d.cancel){
    const eye=d.cancel;
    S.pick[eye]=null; S.savedTarget[eye]=false; S.altLength[eye]=false;
    S.targetLength[eye]=recommendLength(S.fields[eye].ww); render(); return;
  }
  if(d.inv){ S.inv = {eye:d.inv, tab:'stock'}; render(); return; }
  if(d.mtab){ S.inv.tab = d.mtab; render(); return; }
  if(d.scrim!==undefined){ S.inv = null; render(); return; }
  if(d.selscrim!==undefined){ S.selector = false; render(); return; }
});

setInterval(()=>{ if(S.timer>0){ S.timer--;
  const el = document.querySelector('.timer'); if(el) el.textContent = '⧗ '+fmtTimer(); } },1000);

loadFields();
S.newp = NEW_BLANK();
render();
</script>
</body>
</html>
