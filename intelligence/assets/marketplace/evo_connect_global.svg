<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1A2D7E"/>
      <stop offset="55%" stop-color="#0A1B5C"/>
      <stop offset="100%" stop-color="#001E60"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(8,177,194,0.45)"/>
      <stop offset="60%" stop-color="rgba(8,177,194,0.08)"/>
      <stop offset="100%" stop-color="rgba(8,177,194,0)"/>
    </radialGradient>
    <linearGradient id="lensStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3FA8DC"/>
      <stop offset="100%" stop-color="#08B1C2"/>
    </linearGradient>
    <style>
      .grid    { fill:none; stroke:rgba(255,255,255,0.10); stroke-width:1; }
      .grid-2  { fill:none; stroke:rgba(255,255,255,0.07); stroke-width:1; stroke-dasharray:2 4; }
      .lens    { fill:none; stroke:url(#lensStroke); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
      .node    { fill:#08B1C2; }
      .node-sm { fill:#3FA8DC; }
      .conn    { fill:none; stroke:rgba(63,168,220,0.55); stroke-width:1.2; stroke-linecap:round; }
      .conn-d  { fill:none; stroke:rgba(63,168,220,0.35); stroke-width:1; stroke-dasharray:3 4; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Soft cyan glow behind lens -->
  <rect width="400" height="400" fill="url(#centerGlow)"/>

  <!-- Globe latitude/longitude lines -->
  <g transform="translate(200 200)">
    <!-- Outer sphere -->
    <circle r="158" class="grid"/>
    <!-- Latitude ellipses (foreshortened) -->
    <ellipse rx="158" ry="55"  class="grid-2"/>
    <ellipse rx="158" ry="100" class="grid"/>
    <ellipse rx="158" ry="135" class="grid-2"/>
    <!-- Longitude meridians (vertical ellipses) -->
    <ellipse rx="55"  ry="158" class="grid-2"/>
    <ellipse rx="100" ry="158" class="grid"/>
    <ellipse rx="135" ry="158" class="grid-2"/>
    <!-- Equator emphasis -->
    <line x1="-158" y1="0" x2="158" y2="0" class="grid"/>
    <line x1="0" y1="-158" x2="0" y2="158" class="grid"/>
  </g>

  <!-- STAAR ICL lens (centered, scaled to fit globe interior) -->
  <g transform="translate(200 200) scale(0.62) translate(11 -281)">
    <path class="lens" d="M216.7,372.7c0,0-0.2-0.2-0.4-0.5c-0.1-0.2-0.3-0.4-0.4-0.5c-2.7-3.7-11.4-17-11.4-38
      c0-25-0.6-52.8-0.6-52.8s0.6-27.9,0.6-52.8c0-21,8.7-34.3,11.4-38c0.1-0.2,0.3-0.3,0.4-0.5c0.3-0.3,0.4-0.5,0.4-0.5V189
      c3-4,4.8-9,4.8-14.4c0-13.4-10.9-24.3-24.3-24.3c-98,2.4-144.9-7.8-144.9-7.8l0,0c-16.4-4.2-38.7-6.8-63.2-6.8
      s-46.8,2.6-63.2,6.8l0,0c0,0-46.9,10.2-144.9,7.8c-13.4,0-24.3,10.9-24.3,24.3c0,5.4,1.8,10.4,4.8,14.4v0.1c0,0,0.2,0.2,0.4,0.5
      c0.1,0.2,0.3,0.4,0.4,0.5c2.7,3.7,11.4,17,11.4,38c0,25,0.6,52.8,0.6,52.8s-0.6,27.9-0.6,52.8c0,21-8.7,34.3-11.4,38
      c-0.1,0.2-0.3,0.3-0.4,0.5c-0.3,0.3-0.4,0.5-0.4,0.5v0.1c-3,4-4.8,9-4.8,14.4c0,13.4,10.9,24.3,24.3,24.3
      c98-2.4,144.9,7.8,144.9,7.8l0,0c16.4,4.2,38.7,6.8,63.2,6.8s46.8-2.6,63.2-6.8l0,0c0,0,46.9-10.2,144.9-7.8
      c13.4,0,24.3-10.9,24.3-24.3C221.5,381.8,219.7,376.8,216.7,372.7L216.7,372.7z"/>
    <circle class="lens" cx="-218.2" cy="172.7" r="4.3"/>
    <circle class="lens" cx="197.8" cy="389.2" r="4.3"/>
    <circle class="lens" cx="-11" cy="280.8" r="65"/>
    <path class="lens" d="M146.3,150.3c29.4,35.4,47.1,80.9,47.1,130.6c0,49.4-17.5,94.7-46.7,130"/>
    <path class="lens" d="M-168.3,411.4c-29.4-35.4-47.1-80.9-47.1-130.6c0-49.4,17.5-94.7,46.7-130"/>
    <circle cx="-11" cy="280.8" r="6" fill="#08B1C2"/>
  </g>

  <!-- Global connection nodes (clinics around the world) -->
  <g>
    <!-- Connection arcs from center to nodes -->
    <path class="conn-d" d="M 200,200 Q 130,80 65,90"/>
    <path class="conn-d" d="M 200,200 Q 280,75 340,95"/>
    <path class="conn-d" d="M 200,200 Q 320,235 355,300"/>
    <path class="conn-d" d="M 200,200 Q 100,300 55,335"/>
    <path class="conn-d" d="M 200,200 Q 95,180 50,210"/>
    <path class="conn-d" d="M 200,200 Q 290,180 350,210"/>

    <!-- Clinic nodes with subtle glow -->
    <g>
      <circle cx="65"  cy="90"  r="7"   fill="rgba(8,177,194,0.18)"/>
      <circle cx="65"  cy="90"  r="3.5" class="node"/>
    </g>
    <g>
      <circle cx="340" cy="95"  r="7"   fill="rgba(8,177,194,0.18)"/>
      <circle cx="340" cy="95"  r="3.5" class="node"/>
    </g>
    <g>
      <circle cx="355" cy="300" r="7"   fill="rgba(8,177,194,0.18)"/>
      <circle cx="355" cy="300" r="3.5" class="node"/>
    </g>
    <g>
      <circle cx="55"  cy="335" r="7"   fill="rgba(8,177,194,0.18)"/>
      <circle cx="55"  cy="335" r="3.5" class="node"/>
    </g>
    <g>
      <circle cx="50"  cy="210" r="6"   fill="rgba(63,168,220,0.18)"/>
      <circle cx="50"  cy="210" r="3"   class="node-sm"/>
    </g>
    <g>
      <circle cx="350" cy="210" r="6"   fill="rgba(63,168,220,0.18)"/>
      <circle cx="350" cy="210" r="3"   class="node-sm"/>
    </g>

    <!-- Tiny accent dots scattered for "more clinics" -->
    <circle cx="115" cy="55"  r="1.8" class="node-sm"/>
    <circle cx="280" cy="55"  r="1.8" class="node-sm"/>
    <circle cx="100" cy="370" r="1.8" class="node-sm"/>
    <circle cx="305" cy="365" r="1.8" class="node-sm"/>
    <circle cx="22"  cy="270" r="1.5" class="node-sm"/>
    <circle cx="378" cy="270" r="1.5" class="node-sm"/>
  </g>
</svg>
